suite: Operator CA secret sync
templates:
  - templates/operator-ca-secret.yaml
release:
  name: minio-operator
  namespace: minio-operator
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0
  - it: copies all keys without a template and keeps the target unowned
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: fake-operator-ca
      - equal:
          path: spec.infisicalAuthRef
          value: {name: fake-auth, namespace: fake-secrets}
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.sources
          value:
            - projectSlug: fake-project
              environmentSlug: fake-environment
              secretPath: /certificates/internal
              recursive: true
      - equal:
          path: spec.targets
          value:
            - name: fake-operator-ca
              namespace: minio-operator
              kind: Secret
              secretType: kubernetes.io/tls
              creationPolicy: Orphan
              metadata: {labels: {}, annotations: {}}
      - isNull:
          path: spec.targets[0].template
  - it: uses the release namespace for the object and target
    values:
      - ../ci/all-on-values.yaml
    release:
      namespace: alternate
    asserts:
      - equal:
          path: metadata.namespace
          value: alternate
      - equal:
          path: spec.targets[0].namespace
          value: alternate

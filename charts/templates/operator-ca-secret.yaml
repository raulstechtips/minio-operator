{{- if .Values.operatorCaSecret.enabled }}
{{- $inf := .Values.infisical }}
{{- $secret := .Values.operatorCaSecret }}
{{- $name := required "operatorCaSecret.secretName is required when operatorCaSecret is enabled" $secret.secretName }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio-operator-wrapper.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when operatorCaSecret is enabled" $inf.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when operatorCaSecret is enabled" $inf.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: {{ $secret.refreshInterval | quote }}
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when operatorCaSecret is enabled" $inf.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when operatorCaSecret is enabled" $inf.environmentSlug | quote }}
      secretPath: {{ $secret.secretPath | quote }}
      recursive: {{ $secret.recursive }}
  targets:
    - name: {{ $name }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: kubernetes.io/tls
      creationPolicy: Orphan
      metadata:
        labels: {}
        annotations: {}
      # No template: v1beta1 copies all fetched keys as-is, including dotted TLS keys.
      # This preserves v1alpha1 includeAllSecrets: true (ca.crt, tls.crt, tls.key).
{{- end }}
